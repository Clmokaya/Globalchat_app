name: Build and Upload APK

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'  # adjust if needed

      - name: Install dependencies
        run: flutter pub get

      - name: Show commit SHA
        run: echo "This build is for commit ${{ github.sha }}"

      - name: Build release APK
        run: flutter build apk --release

      - name: List APK directory contents
        run: ls -la build/app/outputs/flutter-apk/

      - name: Upload release APK
        uses: actions/upload-artifact@v3
        with:
          name: release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
